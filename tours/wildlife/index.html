       JAVASCRIPT LOGIC (STICKY HEADER, MOBILE DRAWER, OFFCANVAS SEARCH, ACCORDION)

<script>
    // 1. Sticky Header Transparency Transition on Scroll
    const siteHeader = document.getElementById('siteHeader');
    function updateHeaderOnScroll() {
      if (!siteHeader) return;
      if (window.scrollY > 80) {
        siteHeader.classList.add('is-scrolled');
      } else {
        siteHeader.classList.remove('is-scrolled');
      }
    }
    window.addEventListener('scroll', updateHeaderOnScroll, { passive: true });
    updateHeaderOnScroll();

    // 2. Language Switcher (10 Slots Dropdown)
    const langPillToggle = document.getElementById('langPillToggle');
    const langPillMenu = document.getElementById('langPillMenu');
    const currentLangLabel = document.getElementById('currentLangLabel');
    if (langPillToggle && langPillMenu) {
      langPillToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        langPillMenu.classList.toggle('is-active');
      });
      document.addEventListener('click', (e) => {
        if (!langPillToggle.contains(e.target) && !langPillMenu.contains(e.target)) {
          langPillMenu.classList.remove('is-active');
        }
      });
      langPillMenu.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          langPillMenu.querySelectorAll('button').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          const code = btn.getAttribute('data-lang').toUpperCase();
          if (currentLangLabel) currentLangLabel.textContent = code;
          langPillMenu.classList.remove('is-active');
        });
      });
    }

    // Mobile Navigation managed by assets/js/mobile-nav.js

    // 4. Offcanvas Search Modal Toggle
    const searchTrigger = document.getElementById('searchTriggerBtn');
    const searchClose = document.getElementById('searchCloseBtn');
    const offcanvasSearch = document.getElementById('offcanvasSearch');
    if (searchTrigger && offcanvasSearch) {
      searchTrigger.addEventListener('click', () => {
        offcanvasSearch.classList.add('show');
      });
      if (searchClose) {
        searchClose.addEventListener('click', () => {
          offcanvasSearch.classList.remove('show');
        });
      }
      offcanvasSearch.addEventListener('click', (e) => {
        if (e.target === offcanvasSearch) {
          offcanvasSearch.classList.remove('show');
        }
      });
    }

    // 5. FAQ Accordion
    document.querySelectorAll('.accordion-header-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.parentElement;
        const isOpen = item.classList.contains('open');
        document.querySelectorAll('.accordion-item').forEach(i => i.classList.remove('open'));
        if (!isOpen) item.classList.add('open');
      });
    });
  </script>
