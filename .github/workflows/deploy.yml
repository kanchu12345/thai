name: Validate & Deploy Lotus Ceylon

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON catalog integrity
        run: |
          python -c "
          import json, sys
          try:
              with open('data/packages.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              pkgs = data.get('packages', [])
              print(f'Successfully validated {len(pkgs)} packages in data/packages.json')
              assert len(pkgs) >= 26, 'Expected at least 26 packages'
          except Exception as e:
              print(f'Error validating packages.json: {e}')
              sys.exit(1)
          "

      - name: Verify sitemap and critical assets
        run: |
          python -c "
          import os, sys
          required = ['sitemap.xml', 'robots.txt', '404.html', 'js/leaflet-tour-map.js', 'js/tour-interactive.js', 'css/tours-map.css']
          missing = [f for f in required if not os.path.exists(f)]
          if missing:
              print(f'Missing required assets: {missing}')
              sys.exit(1)
          print('All core routing, mapping, and interactive assets verified.')
          "

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
